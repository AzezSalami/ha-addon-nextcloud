name: Nextcloud
version: "35.0.2-6"
slug: nextcloud_official
description: Nextcloud on the official Debian (glibc) image with Nextcloud Office and the built-in CODE server.
url: https://github.com/AzezSalami/ha-addon-nextcloud
arch:
  - amd64
  - aarch64
init: false
startup: services
timeout: 90
services:
  - mysql:want
map:
  - addon_config:rw
  - share:rw
  - backup:rw
  - ssl:ro
ports:
  80/tcp: null
  443/tcp: 8099
webui: "[PROTO:ssl]://[HOST]:[PORT:443]"
ports_description:
  80/tcp: "Plain HTTP (internal use, for example a tunnel or reverse proxy; normally leave empty)"
  443/tcp: "Web interface (HTTPS when ssl is enabled, otherwise plain HTTP)"
options:
  public_url: ""
  internal_url: ""
  trusted_domains: []
  trusted_proxies:
    - "172.30.32.0/23"
  force_public_url: false
  ssl: false
  certfile: ""
  keyfile: ""
  ssl_allow_expired: false
  db_type: mariadb
  db_mode: supervisor
  db_host: ""
  db_port: 0
  db_name: nextcloud
  db_user: ""
  db_password: ""
  admin_user: ""
  admin_password: ""
  data_path: /data/nextcloud-data
  background_jobs: cron
  php_memory_limit: 1024M
  upload_limit: 16G
  default_phone_region: ""
  enable_office: true
  code_diagnostics: true
  code_start_timeout: 240
  backup_on_start: false
  migration_mode: false
  log_level: info
schema:
  public_url: str?
  internal_url: str?
  trusted_domains:
    - str
  trusted_proxies:
    - str
  force_public_url: bool
  ssl: bool
  certfile: match(^[A-Za-z0-9._-]+$)?
  keyfile: match(^[A-Za-z0-9._-]+$)?
  ssl_allow_expired: bool
  db_type: list(mariadb|postgresql)
  db_mode: list(supervisor|external)
  db_host: str?
  db_port: int(0,65535)
  db_name: str
  db_user: str?
  db_password: password?
  admin_user: str?
  admin_password: password?
  data_path: str
  background_jobs: list(cron|ajax|webcron)
  php_memory_limit: match(^[0-9]+[MG]$)
  upload_limit: match(^[0-9]+[MG]$)
  default_phone_region: match(^([A-Z]{2})?$)?
  enable_office: bool
  code_diagnostics: bool
  code_start_timeout: int(30,1800)
  backup_on_start: bool
  migration_mode: bool
  log_level: list(debug|info|warning|error)
