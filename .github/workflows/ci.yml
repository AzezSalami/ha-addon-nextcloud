name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"   # weekly: catches upstream image / Office app breakage

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -x -S warning -e SC1091 nextcloud/rootfs/usr/local/bin/* nextcloud/rootfs/usr/local/lib/nc-addon/*.sh nextcloud/tests/unit/run.sh nextcloud/tests/integration/run.sh
      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: ./nextcloud
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: nextcloud/Dockerfile
          ignore: DL3006,DL3008,DL3059

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y jq php-cli
      - run: bash nextcloud/tests/unit/run.sh

  build:
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            db: mariadb
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            db: postgresql
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            db: mariadb
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: nextcloud
          platforms: ${{ matrix.platform }}
          load: true
          tags: ncaddon:test
      - name: Supervisor-style build must still produce a Debian (glibc) image
        run: |
          # Home Assistant's Supervisor passes its own Alpine image as BUILD_FROM; the Dockerfile must ignore it.
          docker build --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/base:latest \
            --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci \
            -t ncaddon:supervisor nextcloud
          docker run --rm --entrypoint sh ncaddon:supervisor -c '. /etc/os-release; echo "$PRETTY_NAME"; [ "$ID" = debian ] && ldd --version 2>&1 | head -n1 | grep -i glibc'
      - name: Unit tests inside the image
        run: docker run --rm -v "$PWD/nextcloud":/src --entrypoint bash ncaddon:test /src/tests/unit/run.sh
      - name: Integration tests (real ${{ matrix.db }}, real CODE)
        run: NC_TEST_DB=${{ matrix.db }} bash nextcloud/tests/integration/run.sh ncaddon:test
